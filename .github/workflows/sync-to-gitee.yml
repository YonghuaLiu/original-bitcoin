# .github/workflows/sync-to-gitee.yml
name: Sync to Gitee

# 触发条件：当 main 分支（可根据实际分支修改）有 push 或 pull request 合并时触发
on:
  push:
    branches: [ original, revived/main, revived/v0.1.3 ]  
  pull_request:
    branches: [ original, revived/main, revived/v0.1.3 ]
    types: [ closed ]
    if: github.event.pull_request.merged == true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出 GitHub 仓库代码
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取所有历史提交，确保同步完整

      # 2. 配置 Git 身份（避免推送时权限问题）
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      # 3. 添加 Gitee 仓库作为远程仓库
      - name: Add Gitee remote
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@gitee.com/${{ secrets.GITEE_USERNAME }}/original-bitcoin.git

      # 4. 强制推送代码到 Gitee（覆盖同名分支）
      - name: Push to Gitee
        run: |
          git push -f gitee original:original
          git push -f gitee revived/v0.1.3:revived/v0.1.3
          git push -f gitee revived/main:revived/main